name: Build

on:
  push:
    branches: [S3, main]
    tags: ['v*']
    paths:
      - 'AirSuspension/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'AirSuspension/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  FQBN: esp32:esp32:esp32s3:CDCOnBoot=cdc,USBMode=hwcdc,UploadMode=default,FlashSize=4M,PartitionScheme=min_spiffs
  ESP32_CORE: 3.3.12

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to attach binaries to a release
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${ESP32_CORE}
          arduino-cli lib install "U8g2"

      - name: Create placeholder secrets.h
        run: cp AirSuspension/secrets.h.example AirSuspension/secrets.h

      - name: Compile AirSuspension
        run: |
          arduino-cli compile --fqbn "$FQBN" \
            --warnings default \
            --output-dir build \
            AirSuspension

      - uses: actions/upload-artifact@v4
        with:
          name: AirSuspension-esp32s3
          path: build/*.bin

      - name: Attach binaries to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.bin
